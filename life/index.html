<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>테스형 AI 인생설계</title>

<meta name="description" content="테스형: 나를 이해하고, 내일을 설계하다. 목표와 생활 조건으로 근거가 보이는 지침서와 90일 계획을 만들고, 이번 주 작은 행동과 회고로 삶을 고쳐 나가는 서비스.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@900&display=swap">
<style>
/* Concept: a conversation with 테스형 (Socrates as a kind older brother). One question per screen, warm laurel-green +
   morning-sun palette, serif voice for 테스형's lines, sans for everything the user does. Evidence types are labelled
   chips (icon + text). Mobile: bottom tab bar + bottom sheets. Desktop: centered column, max 1120px. */
:root{
  --bg:#F2F4F0; --surface:#FFFFFF; --surface2:#F7F8F5; --ink:#1C2420; --muted:#56615B; --faint:#86918A; --line:#DDE3DD;
  --laurel:#2E6B4E; --laurel-ink:#FFFFFF; --laurel-soft:#E1EEE6; --sun:#E59A2F; --sun-soft:#FCEFD9; --dusk:#3D4A8C;
  --t-user:#2E6B4E; --t-test:#6B4FB8; --t-log:#0F7A86; --t-trad:#B65A1E; --t-ai:#3D4A8C;
  --ok:#2E7D3E; --warn:#B26A00; --err:#C23B3B;
  --shadow:0 1px 2px rgba(20,30,25,.05),0 8px 24px -12px rgba(20,30,25,.18);
  --f-voice:"Gowun Batang","Noto Serif KR","Batang",serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-glyph:"Noto Serif KR","Batang",serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1412; --surface:#16201C; --surface2:#1B2622; --ink:#E7EEE9; --muted:#A4B2AA; --faint:#7C8A82; --line:#2A3832;
  --laurel:#6CC495; --laurel-ink:#0E1412; --laurel-soft:#1F3329; --sun:#F2B65A; --sun-soft:#3A2E1A; --dusk:#9AA6F0;
  --t-user:#6CC495; --t-test:#B7A2FF; --t-log:#5CCAD6; --t-trad:#F2A066; --t-ai:#9AA6F0;
  --ok:#73D38A; --warn:#F2B65A; --err:#FF8A8A; --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -12px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1412; --surface:#16201C; --surface2:#1B2622; --ink:#E7EEE9; --muted:#A4B2AA; --faint:#7C8A82; --line:#2A3832;
  --laurel:#6CC495; --laurel-ink:#0E1412; --laurel-soft:#1F3329; --sun:#F2B65A; --sun-soft:#3A2E1A; --dusk:#9AA6F0;
  --t-user:#6CC495; --t-test:#B7A2FF; --t-log:#5CCAD6; --t-trad:#F2A066; --t-ai:#9AA6F0;
  --ok:#73D38A; --warn:#F2B65A; --err:#FF8A8A; --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -12px rgba(0,0,0,.6); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-padding-top:84px}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(110px + env(safe-area-inset-bottom,0px))}
h1,h2,h3,h4{margin:0;text-wrap:balance;font-weight:700}
h1{font-family:var(--f-voice);font-size:clamp(32px,5.4vw,56px);line-height:1.2;letter-spacing:-.02em}
h2{font-family:var(--f-voice);font-size:clamp(24px,3.6vw,34px);line-height:1.3;letter-spacing:-.01em}
h3{font-size:18px;line-height:1.4}
h4{font-size:16px}
p{margin:0}
a{color:var(--laurel)}
.wrap{max-width:1120px;margin:0 auto}
.col{max-width:680px;margin:0 auto}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.small{font-size:14px}
.tiny{font-size:12.5px;color:var(--faint)}
.eyebrow{font-size:13px;font-weight:600;color:var(--laurel);letter-spacing:.04em}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow)}
.pad{padding:22px}
.btn{font:inherit;font-weight:600;font-size:16px;border-radius:14px;padding:12px 20px;min-height:48px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;transition:transform .12s,background .12s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--laurel);border-color:var(--laurel);color:var(--laurel-ink)}
.btn.sun{background:var(--sun);border-color:var(--sun);color:#1C1408}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.quiet{background:var(--surface2)}
.btn.danger{color:var(--err)}
.btn.sm{padding:7px 14px;min-height:38px;font-size:14px;border-radius:11px}
.btn.wide{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.linkish{background:none;border:0;padding:0;font:inherit;color:var(--laurel);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
:focus-visible{outline:3px solid color-mix(in oklab,var(--laurel) 60%,transparent);outline-offset:2px}
#view:focus,#view:focus-visible{outline:none}

/* top & bottom nav */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:10px max(16px,env(safe-area-inset-left,0px));background:color-mix(in oklab,var(--bg) 86%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.brand b{font-family:var(--f-voice);font-size:21px}
.brand small{display:block;font-size:11.5px;color:var(--faint);margin-top:-3px}
.topnav{display:flex;gap:4px}
.topnav a{text-decoration:none;color:var(--muted);font-size:15px;font-weight:500;padding:8px 12px;border-radius:10px}
.topnav a[aria-current="page"],.topnav a:hover{color:var(--ink);background:var(--surface)}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:25;display:none;background:color-mix(in oklab,var(--surface) 94%,transparent);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-right,0px))}
.tabbar div{display:grid;grid-template-columns:repeat(5,1fr);max-width:560px;margin:0 auto}
.tabbar a{display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;color:var(--faint);font-size:11.5px;padding:6px 0;border-radius:10px}
.tabbar a svg{width:24px;height:24px}
.tabbar a[aria-current="page"]{color:var(--laurel);font-weight:700}

/* 테스형 voice */
.tes{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start}
.tes .av{width:52px;height:52px;flex:none}
.bubble{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:4px 20px 20px 20px;padding:14px 18px;font-family:var(--f-voice);font-size:18px;line-height:1.55;box-shadow:var(--shadow)}
.bubble small{display:block;font-family:var(--f-body);font-size:13.5px;color:var(--muted);margin-top:6px}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:40px;align-items:center;padding-block:36px 20px}
.hero-art{position:relative}
.hero-art svg{width:100%;height:auto;display:block}
.paths{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.path{padding:20px;display:flex;flex-direction:column;gap:8px;text-decoration:none;color:var(--ink)}
.path:hover{border-color:var(--laurel)}
.path .ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--laurel-soft);color:var(--laurel)}
.path.trad .ic{background:var(--sun-soft);color:var(--t-trad)}
.path.cult .ic{background:color-mix(in oklab,var(--dusk) 14%,transparent);color:var(--dusk)}
.trust{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.legend5{display:flex;flex-wrap:wrap;gap:8px}

/* evidence chips */
.ev{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;padding:2px 10px 2px 6px;border-radius:99px;white-space:nowrap;line-height:1.7;vertical-align:1px}
.ev i{width:16px;height:16px;border-radius:50%;display:inline-grid;place-items:center;font-style:normal;font-size:9.5px;font-weight:800;color:#fff}
.ev.USER_CONFIRMED{background:color-mix(in oklab,var(--t-user) 13%,transparent);color:var(--t-user)}.ev.USER_CONFIRMED i{background:var(--t-user)}
.ev.ASSESSMENT{background:color-mix(in oklab,var(--t-test) 13%,transparent);color:var(--t-test)}.ev.ASSESSMENT i{background:var(--t-test)}
.ev.ACTION_LOG{background:color-mix(in oklab,var(--t-log) 13%,transparent);color:var(--t-log)}.ev.ACTION_LOG i{background:var(--t-log)}
.ev.TRADITIONAL{background:color-mix(in oklab,var(--t-trad) 14%,transparent);color:var(--t-trad)}.ev.TRADITIONAL i{background:var(--t-trad)}
.ev.AI_SUGGESTION{background:color-mix(in oklab,var(--t-ai) 13%,transparent);color:var(--t-ai)}.ev.AI_SUGGESTION i{background:var(--t-ai)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .ev i{color:#0E1412}}
:root[data-theme="dark"] .ev i{color:#0E1412}

/* onboarding */
.flow{padding-top:18px;display:flex;flex-direction:column;gap:22px}
.prog{display:flex;align-items:center;gap:12px}
.prog .bar{flex:1;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.prog .bar i{display:block;height:100%;background:var(--laurel);border-radius:3px;transition:width .35s}
.prog span{font-size:13px;color:var(--faint);white-space:nowrap}
.save{font-size:12.5px;color:var(--faint);min-height:1.2em}
.save.err{color:var(--err)}
.q{display:flex;flex-direction:column;gap:12px}
.q>label,.q>.lb{font-weight:700;font-size:17px}
.q .help{font-size:14px;color:var(--muted)}
.q .fe{font-size:14px;color:var(--err)}
.q .cnt{font-size:12.5px;color:var(--faint);align-self:flex-end}
.q .cnt.over{color:var(--err)}
input[type=text],input[type=email],input[type=number],input[type=date],input[type=time],select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:13px 14px;width:100%;min-width:0}
textarea{min-height:110px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--laurel);outline:none;box-shadow:0 0 0 3px color-mix(in oklab,var(--laurel) 22%,transparent)}
[aria-invalid="true"]{border-color:var(--err)!important}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative;display:inline-flex;align-items:center;gap:6px;padding:10px 16px;border-radius:99px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;font-size:15.5px;min-height:44px;user-select:none}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip:has(input:checked){border-color:var(--laurel);background:var(--laurel-soft);color:var(--ink);font-weight:600}
.chip:has(input:focus-visible){outline:3px solid color-mix(in oklab,var(--laurel) 60%,transparent)}
.chip:has(input:disabled){opacity:.45;cursor:not-allowed}
.choice{display:grid;gap:10px}
.opt{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:start;padding:16px 18px;border-radius:18px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt .mk{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);margin-top:2px;display:grid;place-items:center}
.opt input[type=checkbox]~.mk{border-radius:7px}
.opt:has(input:checked){border-color:var(--laurel);background:var(--laurel-soft)}
.opt:has(input:checked) .mk{border-color:var(--laurel);background:var(--laurel);box-shadow:inset 0 0 0 4px var(--laurel-soft)}
.opt:has(input:focus-visible){outline:3px solid color-mix(in oklab,var(--laurel) 60%,transparent)}
.opt b{display:block;font-size:16px}
.opt span.d{font-size:14px;color:var(--muted)}
.slider{display:flex;flex-direction:column;gap:6px}
.slider .v{font-family:var(--f-voice);font-size:30px;font-weight:700;color:var(--laurel)}
input[type=range]{width:100%;accent-color:var(--laurel);height:32px}
.likert{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.likert label{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 2px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;font-size:12px;color:var(--muted);text-align:center}
.likert input{position:absolute;opacity:0}
.likert label b{font-size:16px;color:var(--ink)}
.likert label:has(input:checked){border-color:var(--t-test);background:color-mix(in oklab,var(--t-test) 12%,transparent);color:var(--ink)}
.likert label:has(input:focus-visible){outline:3px solid color-mix(in oklab,var(--t-test) 60%,transparent)}
.item{padding:14px 0;border-bottom:1px dashed var(--line);display:flex;flex-direction:column;gap:8px}
.navq{display:flex;gap:10px;justify-content:space-between;align-items:center;position:sticky;bottom:calc(70px + env(safe-area-inset-bottom,0px));padding-block:10px;background:linear-gradient(transparent,var(--bg) 30%)}
.notice{display:flex;gap:10px;align-items:flex-start;padding:14px 16px;border-radius:16px;background:var(--surface2);border:1px solid var(--line);font-size:14.5px}
.notice.info{background:var(--laurel-soft);border-color:color-mix(in oklab,var(--laurel) 30%,transparent)}
.notice.warn{background:var(--sun-soft);border-color:color-mix(in oklab,var(--sun) 40%,transparent)}
.notice.err{background:color-mix(in oklab,var(--err) 9%,var(--surface));border-color:color-mix(in oklab,var(--err) 40%,transparent)}
.notice .grow{flex:1;min-width:0}
.notice b{display:block;margin-bottom:2px}
.errsum{padding:14px 16px;border-radius:16px;border:1.5px solid var(--err);background:color-mix(in oklab,var(--err) 7%,var(--surface))}
.errsum ul{margin:6px 0 0;padding-left:18px}
.sumrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;padding:14px 0;border-bottom:1px solid var(--line);align-items:start}
.sumrow .k{font-size:13px;color:var(--faint)}

/* making */
.making{display:flex;flex-direction:column;align-items:center;gap:20px;text-align:center;padding-top:30px}
.making .av{width:110px;height:110px}
.making .av .think{animation:bob 1.6s ease-in-out infinite alternate;transform-origin:50% 50%}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-4px)}}
.stages{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;width:100%;max-width:440px;text-align:left}
.stages li{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-size:15px}
.stages li i{width:12px;height:12px;border-radius:50%;background:var(--line);justify-self:center}
.stages li.done i{background:var(--laurel)}.stages li.cur i{background:var(--sun);animation:pulse 1s ease-in-out infinite alternate}.stages li.na{opacity:.55}.stages li.fail i{background:var(--err)}
.stages li em{font-style:normal;font-size:12.5px;color:var(--faint)}
@keyframes pulse{from{transform:scale(.7)}to{transform:scale(1.2)}}

/* guide */
.ghead{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:end;padding-top:18px}
.segnav{position:sticky;top:calc(env(safe-area-inset-top,0px) + 62px);z-index:10;display:flex;gap:6px;overflow-x:auto;padding:8px 2px;margin-inline:-2px;background:linear-gradient(var(--bg) 80%,transparent)}
.segnav a{flex:none;text-decoration:none;font-size:14px;font-weight:600;color:var(--muted);padding:8px 14px;border-radius:99px;background:var(--surface);border:1px solid var(--line)}
.segnav a:hover{color:var(--ink);border-color:var(--laurel)}
.glance{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px}
.bigq{font-family:var(--f-voice);font-size:clamp(22px,3vw,28px);line-height:1.45}
.res{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.res div{padding:12px;border-radius:16px;background:var(--surface2);display:flex;flex-direction:column}
.res b{font-family:var(--f-voice);font-size:22px}
.res span{font-size:13px;color:var(--muted)}
.gsec{scroll-margin-top:130px;display:flex;flex-direction:column;gap:14px}
.gsec>h2{display:flex;align-items:baseline;gap:10px}
.gsec>h2 small{font-family:var(--f-body);font-size:13px;font-weight:600;color:var(--faint)}
.insight{padding:18px 20px;display:flex;flex-direction:column;gap:10px}
.insight .txt{font-size:16.5px;line-height:1.65}
.insight .meta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.insight .fb{display:flex;gap:6px}
.insight .fb button{font:inherit;font-size:13px;padding:6px 12px;border-radius:99px;border:1px solid var(--line);background:var(--surface2);color:var(--muted);cursor:pointer;min-height:34px}
.insight .fb button[aria-pressed="true"]{background:var(--laurel);border-color:var(--laurel);color:var(--laurel-ink)}
.insight .why{font:inherit;font-size:13px;background:none;border:0;color:var(--laurel);cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:3px}
.insight blockquote{margin:0;padding:10px 14px;border-left:3px solid var(--t-user);background:var(--surface2);border-radius:0 12px 12px 0;font-size:15px;color:var(--muted)}
.insight .ask{font-family:var(--f-voice);font-size:16px;color:var(--ink);background:var(--sun-soft);padding:10px 14px;border-radius:12px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.scen{padding:18px;display:flex;flex-direction:column;gap:10px;position:relative}
.scen .tag{align-self:flex-start;font-size:12.5px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--surface2);color:var(--muted)}
.scen.fit{border-color:var(--laurel);box-shadow:0 0 0 1px var(--laurel) inset,var(--shadow)}
.scen.fit .tag{background:var(--laurel);color:var(--laurel-ink)}
.scen dl{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;font-size:14px}
.scen dt{color:var(--faint)}
.scen dd{margin:0}
.flag{font-size:12px;font-weight:700;color:var(--warn)}
.phase{display:grid;grid-template-columns:90px minmax(0,1fr);gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.phase b.w{font-family:var(--f-voice);font-size:18px;color:var(--laurel)}
.phase .t{font-weight:600}
.phase .m{font-size:14px;color:var(--muted)}
.mcii{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.mcii div{padding:14px;border-radius:16px;background:var(--surface2)}
.mcii small{display:block;font-size:12.5px;font-weight:700;color:var(--laurel);margin-bottom:4px}
.acard{padding:18px 20px;display:flex;flex-direction:column;gap:12px;border-left:5px solid var(--sun)}
.acard .if{font-family:var(--f-voice);font-size:18px;line-height:1.5}
.acard .if em{font-style:normal;color:var(--laurel);font-weight:700}
.acard dl{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:5px 14px;font-size:14.5px}
.acard dt{color:var(--faint)}
.acard dd{margin:0}
.radar svg{width:100%;max-width:340px;display:block;margin:0 auto}
.bars5{display:flex;flex-direction:column;gap:10px}
.bars5 .r{display:grid;grid-template-columns:110px minmax(0,1fr) 40px;gap:10px;align-items:center;font-size:14.5px}
.bars5 .tr{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.bars5 .tr i{display:block;height:100%;background:var(--t-test);border-radius:5px}
.bars5 .n{font-variant-numeric:tabular-nums;text-align:right;color:var(--muted)}

  <path d="M19 33 C21 49, 43 49, 45 33 C41 40, 23 40, 19 33Z" fill="var(--surface2)" stroke="var(--ink)" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M27 30.5 h2 M35 30.5 h2" stroke="var(--ink)" stroke-width="2" stroke-linecap="round"/><path d="M28 38 Q32 40.5 36 38" fill="none" stroke="var(--ink)" stroke-width="1.6" stroke-linecap="round"/>
  ${[[-1,0],[1,0]].map(([s])=>[0,1,2,3].map(i=>{const a=(200+i*22)*Math.PI/180,x=32+s*19*Math.cos(a)*-1,y=26+19*Math.sin(a);return `<ellipse cx="${32+s*(14+i*1.2)}" cy="${12+i*4.2}" rx="4.4" ry="2.2" transform="rotate(${s*(-30+i*16)} ${32+s*(14+i*1.2)} ${12+i*4.2})" fill="var(--laurel)"/>`;}).join('')).join('')}
  </g></svg>`;}
const tes=(line,sub)=>`<div class="tes">${avatar(52)}<div class="bubble">${line}${sub?`<small>${sub}</small>`:''}</div></div>`;

const KEY='tes-v4';let DB,saveT=null,lastSave=null,saveErr=false;
const blank=()=>({v:4,user:null,consents:[],draft:null,birth:null,gens:[],reports:[],plans:[],checkins:[],feedbacks:[],privacy:[]});
function loadDB(){try{DB=JSON.parse(localStorage.getItem(KEY)||'null')||blank();}catch(e){DB=blank();}}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(DB));saveErr=false;lastSave=nowISO();}catch(e){saveErr=true;}updSave();}
function updSave(st){const e=$('#save');if(!e)return;e.classList.toggle('err',saveErr);e.textContent=saveErr?'저장하지 못했어요 · 연결을 확인해 주세요':st==='saving'?'저장 중…':lastSave?`자동 저장됨 ${hhmm(lastSave)}`:'';}
addEventListener('storage',e=>{if(e.key!==KEY)return;try{const f=JSON.parse(e.newValue||'null');if(!f)return;if(DB.draft&&f.draft&&f.draft.revision>DB.draft.revision&&location.hash.startsWith('#/start')){const b=$('#conflict');if(b){b.hidden=false;b.querySelector('button').onclick=()=>{DB=f;route();toast('다른 창의 최신 내용을 불러왔어요');};}}else{DB=f;route();}}catch(x){}});
const consentOn=p=>{const l=DB.consents.filter(c=>c.p===p).pop();return !!l&&l.on;};
function setConsent(p,on){if(consentOn(p)===on)return;DB.consents.push({p,v:CONSENT[p].v,on,at:nowISO()});}
const authed=()=>!!(DB.user&&DB.user.status==='active');
function draft(){if(!DB.draft)DB.draft={revision:1,domain:null,change:'',situation:'',minutes:null,minutesUnknown:true,budget:null,constraints:[],obstacle:null,values:[],giveUp:'',areas:Object.fromEntries(AREAS.map(a=>[a,5])),areasTouched:false,reflect:{},ipip:{},ipipSkipped:false,mbti:'',paths:{saju:false,astro:false}};return DB.draft;}
function patch(fn){const d=draft();fn(d);d.revision++;d.updated=nowISO();updSave('saving');clearTimeout(saveT);saveT=setTimeout(persist,800);}
function flush(){if(saveT){clearTimeout(saveT);saveT=null;persist();}return !saveErr;}

function go(h){if(location.hash===h)route();else location.hash=h;}
addEventListener('hashchange',route);
const last=a=>a.length?a[a.length-1]:null;
let genTick=null;
function route(){
  flush();clearTimeout(genTick);closeSheet(true);
  const h=location.hash||'#/';let m;const need=()=>{if(!authed()){go('#/start/1');return true;}return false;};
  try{
    if(h==='#/'||h==='')pLanding();
    else if(h==='#/example')pExample();
    else if(h.startsWith('#/explore'))pExplore();
    else if(h==='#/help')pHelp();
    else if((m=h.match(/^#\/start\/(\w+)/)))pStart(m[1]);
    else if((m=h.match(/^#\/making\/([\w-]+)/))){if(need())return;pMaking(m[1]==='latest'?(last(DB.gens)||{}).id:m[1]);}
    else if((m=h.match(/^#\/guide\/([\w-]+)/))){if(need())return;pGuide(m[1]==='latest'?(last(DB.reports.filter(r=>r.status==='available'))||last(DB.reports)||{}).id:m[1]);}
    else if((m=h.match(/^#\/plan\/([\w-]+)/))){if(need())return;const id=m[1]==='latest'?(last(DB.plans.filter(p=>p.status==='draft'))||activePlan()||last(DB.plans)||{}).id:m[1];pPlan(id);}
    else if(h==='#/home'){if(need())return;pHome();}
    else if(h.startsWith('#/checkin')){if(need())return;const p=activePlan();pCheckin(p,p?+(h.split('/')[2]||curWeek(p)):1);}
    else if(h==='#/history'){if(need())return;pHistory();}
    else if((m=h.match(/^#\/me\/requests\/([\w-]+)/)))pRequest(m[1]==='latest'?(last(DB.privacy)||{}).id:m[1]);
    else if(h==='#/me')pMe();
    else pLanding();
  }catch(e){console.error(e);$('#view').innerHTML=`<div class="col" style="padding-top:40px"><div class="notice err"><span class="grow"><b>화면을 그리지 못했어요</b>${esc(e.message)}</span><a class="btn sm" href="#/">처음으로</a></div></div>`;}
  setNav();scrollTo(0,0);$('#view').focus({preventScroll:true});
}

/* ═════════ 대화형 입력 ═════════ */
function steps(){const d=DB.draft||{paths:{}};return ['1','domain','change','resource','constraint','values','areas','reflect','ipip','path'].concat(d.paths&&(d.paths.saju||d.paths.astro)?['birth']:[]).concat(['review']);}
function stepShell(key,inner,{back,next,nextLabel='다음',skip}={}){const S=steps(),i=S.indexOf(key),pct=Math.round((i+1)/S.length*100);
  return `<div class="col flow"><div class="prog"><div class="bar" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100" aria-label="입력 진행"><i style="width:${pct}%"></i></div><span>${i+1} / ${S.length}</span></div>
   <div class="notice warn" id="conflict" hidden><span class="grow"><b>다른 창에서 내용이 바뀌었어요</b>최신 내용을 확인해 주세요.</span><button class="btn sm" type="button">최신 내용 보기</button></div>
   ${inner}<p class="save" id="save" role="status"></p>
   <div class="navq">${back?`<a class="btn ghost" href="#/start/${back}">← 이전</a>`:'<span></span>'}<div class="row">${skip?`<button class="btn ghost" type="button" id="skip">${skip}</button>`:''}${next?`<button class="btn primary" type="button" id="next">${nextLabel} →</button>`:''}</div></div></div>`;}
const nextStep=k=>{const S=steps();return S[S.indexOf(k)+1];},prevStep=k=>{const S=steps();return S[S.indexOf(k)-1];};
function goNext(k){if(!flush()){toast('저장하지 못했어요. 연결을 확인하고 다시 눌러 주세요');return;}go('#/start/'+nextStep(k));}
function cnt(el,max,min){const c=el.parentElement.querySelector('.cnt');if(!c)return;const n=ulen(el.value);c.textContent=`${n} / ${max}`;c.classList.toggle('over',n>max||(min&&n>0&&n<min));}

    const c=$('#chg'),s=$('#sit');cnt(c,500,10);cnt(s,1000);c.oninput=()=>{cnt(c,500,10);patch(x=>x.change=c.value);};s.oninput=()=>{cnt(s,1000);patch(x=>x.situation=s.value);};

      <p class="help small muted" id="minHelp">${d.minutes===0&&!d.minutesUnknown?'0분이면 행동 대신 쉬어 가며 관찰하는 계획을 드릴게요.':'미정이어도 지침서는 만들 수 있어요. 계획을 시작하기 전에만 정하면 돼요.'}</p></div></div>

    ${d.paths.saju?`<div class="q"><span class="lb">태어난 시각</span><div class="chips">${[['exact','정확히 알아요'],['range','대략 알아요'],['unknown','몰라요']].map(([k,n])=>`<label class="chip"><input type="radio" name="prec" value="${k}" ${B.prec===k?'checked':''}>${n}</label>`).join('')}</div><div id="precX"></div></div>
    <div class="q"><label for="city">태어난 도시</label><select id="city"><option value="">도시를 골라 줘요</option>${CITIES.map(c=>`<option value="${c[0]}" ${B.city===c[0]?'selected':''}>${c[1]}</option>`).join('')}</select><p class="help">국내 16개 도시를 지원해요. 계산 기준: ${RULESET.txt}</p></div>`:'<p class="help">별자리만 고르셨다면 생년월일만 있으면 돼요.</p>'}
   </div>`,{back:'path',next:true,nextLabel:'확인하러 가기',skip:'이번엔 전통 해석 빼기'});
  const save=()=>{const v=n=>($(`input[name=${n}]:checked`)||{}).value;const nb={cal:v('cal'),y:$('#by').value,m:$('#bm').value,d:$('#bd').value,leap:v('cal')==='lunar'?(v('leap')==='1'?true:v('leap')==='0'?false:null):null,prec:v('prec')||null,time:($('#bt')||{}).value||'',ts:($('#ts')||{}).value||'',te:($('#te')||{}).value||'',city:($('#city')||{}).value||''};DB.birth=nb;patch(()=>{});conv();};
  const px=()=>{const p=($('input[name=prec]:checked')||{}).value,b=DB.birth||B,X=$('#precX');if(!X)return;
    X.innerHTML=p==='exact'?`<input type="time" id="bt" value="${esc(b.time)}" aria-label="출생 시각" style="max-width:200px">`:p==='range'?`<div class="row"><label class="small">부터 <input type="time" id="ts" value="${esc(b.ts)}" style="max-width:150px"></label><label class="small">까지 <input type="time" id="te" value="${esc(b.te)}" style="max-width:150px"></label></div><p class="help">범위 안에서 시주가 달라지면 가능한 경우를 모두 보여 드려요(최대 8개).</p>`:p==='unknown'?'<div class="notice info"><span class="grow small">시주와 시주에 따른 해석은 빼고 보여 드릴게요.</span></div>':'';

function toSolar(b){const y=+b.y,m=+b.m,d=+b.d;if(!(y>=1900&&y<=2100))return {error:'1900년부터 2100년 사이만 지원해요.',code:'UNSUPPORTED_BIRTH_INPUT'};if(!(m>=1&&m<=12&&d>=1&&d<=31))return {error:'날짜를 확인해 줘요.'};
  if(b.cal==='lunar'){if(b.leap===null)return {error:'윤달 여부를 몰라서 양력으로 바꾸지 않았어요.',code:'LUNAR_LEAP_UNKNOWN'};const r=LUNAR.toSolar(y,m,d,b.leap);return r.error?{error:r.error}:r;}
  const t=new Date(Date.UTC(y,m-1,d));return t.getUTCMonth()===m-1?{y,m,d}:{error:'없는 날짜예요.'};}
function birthErrors(b,saju){const e=[];if(!b)return [{m:'생년월일을 적어 줘요.'}];const r=toSolar(b);if(r.error)e.push({m:r.error,code:r.code});
  if(saju){if(!b.prec)e.push({m:'태어난 시각을 아는지 골라 줘요.'});if(b.prec==='exact'&&!b.time)e.push({m:'태어난 시각을 적어 줘요.'});if(b.prec==='range'&&(!b.ts||!b.te))e.push({m:'시각 범위의 시작과 끝을 적어 줘요.'});if(!b.city)e.push({m:'태어난 도시를 골라 줘요.'});}return e;}

let lastFocus=null;
function openSheet(html,bind){lastFocus=document.activeElement;$('#sheetRoot').innerHTML=`<div class="sheet" role="dialog" aria-modal="true"><div class="box"><div class="grab" aria-hidden="true"></div>${html}</div></div>`;const m=$('#sheetRoot .sheet');
  m.addEventListener('click',e=>{if(e.target===m)closeSheet();});m.querySelectorAll('[data-x]').forEach(b=>b.addEventListener('click',()=>closeSheet()));bind&&bind(m);const f=m.querySelector('input,textarea,select,button');f&&f.focus();
  m.addEventListener('keydown',e=>{if(e.key!=='Tab')return;const fs=[...m.querySelectorAll('a,button,input,select,textarea')].filter(x=>!x.disabled);if(!fs.length)return;if(e.shiftKey&&document.activeElement===fs[0]){e.preventDefault();fs[fs.length-1].focus();}else if(!e.shiftKey&&document.activeElement===fs[fs.length-1]){e.preventDefault();fs[0].focus();}});}
function closeSheet(silent){if(!$('#sheetRoot').innerHTML)return;$('#sheetRoot').innerHTML='';if(!silent&&lastFocus&&lastFocus.focus)lastFocus.focus({preventScroll:true});}
