<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>테스형 AI 인생설계</title>

<meta name="description" content="목표와 생활 조건을 바탕으로 근거가 구분된 지침서와 90일 계획을 만들고, 이번 주 행동과 주간 회고로 실행을 돕는 테스형 AI 인생설계 프로토타입.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;700;900&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Serif+KR:wght@900&display=swap">
<style>
/* Layout: "life blueprint" drafting sheet. Max 1200px. Guided setup (single column) → report (TOC · body · evidence)
   → plan review → weekly board. Evidence types are always text badges, never color alone. Body 16px / 1.6. */
:root{
  --paper:#F2F4F7; --sheet:#FFFFFF; --ink:#141C2E; --muted:#535C72; --faint:#7E879C; --line:#DCE1EA; --grid:rgba(30,58,138,.05);
  --accent:#2F54EB; --accent-ink:#FFFFFF; --accent-soft:#E6ECFF;
  --t-user:#1F7A4D; --t-test:#7048E8; --t-log:#0B7285; --t-trad:#C2410C; --t-ai:#2F54EB;
  --ok:#2B8A3E; --warn:#B54708; --err:#C92A2A; --mute:#868E96;
  --f-display:"Gothic A1","IBM Plex Sans KR",system-ui,sans-serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --f-glyph:"Noto Serif KR","Batang",serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0C111C; --sheet:#141B2A; --ink:#E6EBF5; --muted:#A3ADC4; --faint:#7A84A0; --line:#27314B; --grid:rgba(120,150,255,.05);
  --accent:#7B96FF; --accent-ink:#0C111C; --accent-soft:#1D2849;
  --t-user:#5FD39A; --t-test:#B39CFF; --t-log:#4FC8D9; --t-trad:#FF9A5C; --t-ai:#7B96FF;
  --ok:#69DB7C; --warn:#FFB45C; --err:#FF8787; --mute:#9AA4BC; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0C111C; --sheet:#141B2A; --ink:#E6EBF5; --muted:#A3ADC4; --faint:#7A84A0; --line:#27314B; --grid:rgba(120,150,255,.05);
  --accent:#7B96FF; --accent-ink:#0C111C; --accent-soft:#1D2849;
  --t-user:#5FD39A; --t-test:#B39CFF; --t-log:#4FC8D9; --t-trad:#FF9A5C; --t-ai:#7B96FF;
  --ok:#69DB7C; --warn:#FFB45C; --err:#FF8787; --mute:#9AA4BC; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-padding-top:80px}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px}
h1,h2,h3,h4{margin:0;text-wrap:balance}
h1{font-family:var(--f-display);font-weight:900;font-size:clamp(30px,5vw,52px);line-height:1.15;letter-spacing:-.03em}
h2{font-family:var(--f-display);font-weight:900;font-size:clamp(22px,3.2vw,30px);letter-spacing:-.02em;line-height:1.25}
h3{font-family:var(--f-display);font-weight:700;font-size:18px}
h4{font-family:var(--f-display);font-weight:700;font-size:16px}
p{margin:0}
a{color:var(--accent)}
.wrap{max-width:1200px;margin:0 auto}
.narrow{max-width:760px;margin:0 auto}
.label{font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.lead{color:var(--muted);max-width:66ch}
.note{font-size:14px;color:var(--muted)}
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:14px}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{font:inherit;font-weight:600;font-size:15px;border-radius:10px;padding:10px 16px;cursor:pointer;border:1px solid var(--line);background:var(--sheet);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;min-height:44px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--err);border-color:color-mix(in oklab,var(--err) 40%,var(--line))}
.btn.sm{padding:6px 12px;font-size:13.5px;min-height:36px}
.btn:disabled,.btn[aria-disabled="true"]{opacity:.45;cursor:not-allowed}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.chip:has(input:focus-visible),a:focus-visible,summary:focus-visible,.claim:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.linkbtn{background:none;border:0;padding:0;font:inherit;color:var(--accent);cursor:pointer;text-decoration:underline;text-underline-offset:3px}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:10px max(16px,env(safe-area-inset-left,0px));
  background:color-mix(in oklab,var(--paper) 90%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:900;font-size:18px;letter-spacing:-.02em;text-decoration:none;color:var(--ink);line-height:1.15}
.logo svg{width:30px;height:30px;flex:none}
.logo small{display:block;font-family:var(--f-mono);font-weight:500;font-size:10.5px;color:var(--faint);letter-spacing:.08em}
.proto{font-family:var(--f-mono);font-size:11px;padding:3px 8px;border-radius:99px;border:1px dashed var(--warn);color:var(--warn)}
.nav{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.nav a{font-size:14px;color:var(--muted);text-decoration:none;padding:6px 10px;border-radius:8px}
.nav a:hover,.nav a[aria-current="page"]{color:var(--ink);background:var(--accent-soft)}

/* screen map */
.smap{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:30}
.smap>button{box-shadow:0 8px 24px -8px rgba(0,0,0,.35)}
.smap .panel{position:absolute;right:0;bottom:56px;width:min(340px,calc(100vw - 32px));max-height:min(70vh,560px);overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:0 20px 50px -20px rgba(0,0,0,.4)}
.smap ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.smap li a{display:grid;grid-template-columns:62px minmax(0,1fr);gap:8px;padding:7px 8px;border-radius:8px;text-decoration:none;color:var(--ink);font-size:14px}
.smap li a:hover,.smap li a[aria-current="page"]{background:var(--accent-soft)}
.smap li a span{font-family:var(--f-mono);font-size:12px;color:var(--faint)}

/* stepper */
.steps{display:flex;gap:6px;flex-wrap:wrap;list-style:none;margin:0;padding:0}
.steps li{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--faint);padding:5px 12px 5px 5px;border-radius:99px;border:1px solid var(--line);background:var(--sheet)}
.steps li i{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-family:var(--f-mono);font-size:12px;background:var(--paper)}
.steps li.on{color:var(--ink);border-color:var(--accent)}
.steps li.on i{background:var(--accent);color:var(--accent-ink)}
.steps li.done i{background:var(--accent-soft);color:var(--accent)}
.savest{font-family:var(--f-mono);font-size:12.5px;color:var(--muted)}
.savest.err{color:var(--err)}

/* forms */
.panel{padding:24px;display:flex;flex-direction:column;gap:20px}
.f{display:flex;flex-direction:column;gap:6px;min-width:0}
.f>.lb{font-size:15px;font-weight:600}
.f>.lb em{font-style:normal;color:var(--err);margin-left:4px}
.f>.lb small{font-weight:400;color:var(--faint);margin-left:6px;font-size:13px}
.f .help{font-size:13.5px;color:var(--muted)}
.f .cnt{font-family:var(--f-mono);font-size:12px;color:var(--faint);align-self:flex-end}
.f .cnt.over{color:var(--err)}
.f .fe{font-size:13.5px;color:var(--err)}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
textarea{min-height:96px;resize:vertical}
input[aria-invalid="true"],textarea[aria-invalid="true"],select[aria-invalid="true"]{border-color:var(--err)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative;display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:99px;border:1.5px solid var(--line);background:var(--sheet);cursor:pointer;font-size:15px;min-height:40px}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip:has(input:checked){border-color:var(--accent);background:var(--accent-soft);font-weight:600}
.chip:has(input:disabled){opacity:.5;cursor:not-allowed}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.chk{display:flex;align-items:flex-start;gap:10px;cursor:pointer}
.chk input{width:20px;height:20px;margin-top:2px;accent-color:var(--accent);flex:none}
.chk small{display:block;color:var(--muted);font-size:13.5px}
.errsum{padding:12px 14px;border-radius:10px;border:1px solid var(--err);background:color-mix(in oklab,var(--err) 8%,transparent);color:var(--ink)}
.errsum ul{margin:6px 0 0;padding-left:18px}
.banner{padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--sheet);display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.banner b{flex:none}
.banner.info{border-color:color-mix(in oklab,var(--accent) 40%,var(--line));background:var(--accent-soft)}
.banner.warn{border-color:color-mix(in oklab,var(--warn) 45%,var(--line));background:color-mix(in oklab,var(--warn) 9%,var(--sheet))}
.banner.err{border-color:color-mix(in oklab,var(--err) 45%,var(--line));background:color-mix(in oklab,var(--err) 8%,var(--sheet))}
.banner .grow{flex:1;min-width:200px}
.navbtns{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding-top:4px}

/* badges */
.tb{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:1px 8px;border-radius:99px;border:1px solid currentColor;white-space:nowrap;line-height:1.6;vertical-align:1px}
.tb.USER_CONFIRMED{color:var(--t-user)}.tb.ASSESSMENT{color:var(--t-test)}.tb.ACTION_LOG{color:var(--t-log)}.tb.TRADITIONAL{color:var(--t-trad)}.tb.AI_SUGGESTION{color:var(--t-ai)}
.tb::before{font-family:var(--f-mono);font-size:10px}
.tb.USER_CONFIRMED::before{content:"U"}.tb.ASSESSMENT::before{content:"T"}.tb.ACTION_LOG::before{content:"L"}.tb.TRADITIONAL::before{content:"전"}.tb.AI_SUGGESTION::before{content:"AI"}
.st{font-size:12.5px;font-weight:600;padding:2px 10px;border-radius:99px;border:1px solid var(--line);white-space:nowrap}
.st.ok{color:var(--ok);border-color:currentColor}.st.warn{color:var(--warn);border-color:currentColor}.st.err{color:var(--err);border-color:currentColor}.st.mute{color:var(--mute)}

/* landing */
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:40px;align-items:center;padding-block:40px 24px}
.hero-art svg{width:100%;height:auto;display:block}
.flow3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.flow3 .sheet{padding:18px;display:flex;flex-direction:column;gap:6px}
.flow3 .n{font-family:var(--f-mono);font-size:12px;color:var(--accent)}
.types{display:flex;flex-direction:column;gap:8px}
.types div{display:flex;gap:10px;align-items:baseline;font-size:15px}

/* report */
.rep{display:grid;grid-template-columns:200px minmax(0,1fr) 300px;gap:20px;align-items:start}
.toc{position:sticky;top:76px;display:flex;flex-direction:column;gap:2px}
.toc a{font-size:14px;color:var(--muted);text-decoration:none;padding:6px 10px;border-radius:8px;border-left:2px solid transparent}
.toc a:hover{color:var(--ink);background:var(--accent-soft)}
.sec{padding:22px;display:flex;flex-direction:column;gap:12px}
.claim{display:block;width:100%;text-align:left;font:inherit;color:var(--ink);background:none;border:1px solid transparent;border-radius:10px;padding:10px 12px;cursor:pointer;line-height:1.6}
.claim:hover{background:var(--paper);border-color:var(--line)}
.claim.sel{border-color:var(--accent);background:var(--accent-soft)}
.claim .tags{display:inline-flex;gap:4px;flex-wrap:wrap;margin-left:6px}
.claim.blocked{opacity:.55}
.evd{position:sticky;top:76px;padding:18px;display:flex;flex-direction:column;gap:10px;max-height:calc(100vh - 100px);overflow:auto}
.evd dl{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 12px;font-size:14px}
.evd dt{color:var(--faint)}
.evd dd{margin:0;word-break:break-word}
.opt-tbl{width:100%;border-collapse:collapse;font-size:14.5px}
.opt-tbl th,.opt-tbl td{border-bottom:1px solid var(--line);padding:8px;text-align:left;vertical-align:top}
.opt-tbl th{color:var(--faint);font-weight:500;font-size:13px}
.tbl-scroll{overflow-x:auto}
.myeong{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;text-align:center;max-width:420px}
.myeong div{border:1px solid var(--line);border-radius:10px;padding:8px 0;background:var(--paper);display:flex;flex-direction:column;line-height:1.2}
.myeong small{font-size:12px;color:var(--faint);margin-bottom:4px}
.myeong b{font-family:var(--f-glyph);font-size:26px}
.myeong .na b{color:var(--faint);font-size:16px;font-family:var(--f-body);padding:8px 0}

/* plan */
.goal{padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--paper);display:flex;flex-direction:column;gap:8px}
.act{padding:16px;border-radius:12px;border:1px solid var(--line);background:var(--sheet);display:flex;flex-direction:column;gap:10px}
.act .h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
.act .h b{font-size:16.5px}
.act dl{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;font-size:14px}
.act dt{color:var(--faint)}
.act dd{margin:0}
.cap{display:flex;flex-direction:column;gap:6px}
.cap .tr{height:12px;border-radius:6px;background:var(--line);overflow:hidden;position:relative}
.cap .tr i{position:absolute;top:0;bottom:0;left:0;background:var(--accent);border-radius:6px}
.cap .tr i.over{background:var(--err)}
.occ{display:flex;gap:6px;flex-wrap:wrap}
.occ .o{display:flex;flex-direction:column;gap:4px;padding:8px;border-radius:10px;border:1px solid var(--line);min-width:150px;flex:1}
.occ .o .d{font-family:var(--f-mono);font-size:12.5px;color:var(--muted)}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button{font:inherit;font-size:13px;padding:5px 9px;border-radius:8px;border:1px solid var(--line);background:var(--sheet);color:var(--muted);cursor:pointer;min-height:32px}
.seg button[aria-pressed="true"]{font-weight:700;color:var(--accent-ink);background:var(--accent);border-color:var(--accent)}
.seg button[aria-pressed="true"].skip{background:var(--mute);border-color:var(--mute)}
.seg button[aria-pressed="true"].done{background:var(--ok);border-color:var(--ok);color:#fff}
.weekbar{display:flex;gap:4px;flex-wrap:wrap}
.weekbar button{font:inherit;font-size:12.5px;width:40px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--sheet);color:var(--muted);cursor:pointer}
.weekbar button[aria-current="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.weekbar button:disabled{opacity:.4;cursor:not-allowed}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.stats div{padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--paper);display:flex;flex-direction:column}
.stats b{font-family:var(--f-display);font-size:22px}
.stats span{font-size:13px;color:var(--muted)}

/* list / history */
.list{display:flex;flex-direction:column;gap:10px}
.item{padding:16px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center}
.item .meta{font-size:13.5px;color:var(--muted)}
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.tl li{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--sheet)}
.tl li i{width:12px;height:12px;border-radius:50%;background:var(--line);justify-self:center}
.tl li.done i{background:var(--ok)}.tl li.cur i{background:var(--accent);animation:pulse 1s ease-in-out infinite alternate}.tl li.fail i{background:var(--err)}.tl li.na i{background:transparent;border:1px dashed var(--faint)}
@keyframes pulse{from{transform:scale(.7)}to{transform:scale(1.15)}}

/* modal & drawer & toast */
.modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px;background:rgba(10,14,25,.5)}
.modal .box{width:min(640px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:22px;display:flex;flex-direction:column;gap:14px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 16px;border-radius:99px;font-size:14px;font-weight:600;z-index:60}
footer{margin-top:48px;font-size:13.5px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){.tl li.cur i{animation:none}}
@media (max-width:1100px){.rep{grid-template-columns:minmax(0,1fr) 280px}.toc{display:none}}
@media (max-width:860px){
  .hero{grid-template-columns:1fr}.hero-art{max-width:420px;margin:0 auto;width:100%}
  .flow3,.grid2,.grid3,.stats{grid-template-columns:1fr}
  .rep{grid-template-columns:1fr}.evd{position:static;max-height:none}
}
@media (max-width:520px){.panel,.sec{padding:16px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.item{grid-template-columns:1fr}}
</style>
</head>
<body>

<header class="bar"><div class="wrap">
  <a class="logo" href="#/" aria-label="테스형 처음 화면">
    <svg viewBox="0 0 30 30" aria-hidden="true"><rect x="1" y="1" width="28" height="28" rx="8" fill="none" stroke="currentColor" stroke-width="1.5" opacity=".3"/><path d="M8 21 L15 8 L22 21" fill="none" stroke="var(--accent)" stroke-width="2.4" stroke-linejoin="round"/><path d="M10.5 16.5 H19.5" stroke="var(--t-trad)" stroke-width="2"/><circle cx="15" cy="8" r="2" fill="var(--t-user)"/></svg>
    <span>테스형<small>AI 인생설계 · 3.0</small></span>
  </a>
  <div class="row"><span class="proto" title="서버·이메일 인증 없이 이 브라우저에서만 동작하는 시연판이에요">프로토타입</span><nav class="nav" id="topnav" aria-label="주 메뉴"></nav></div>
</div></header>

<main class="wrap" id="view" tabindex="-1"></main>

<script>
/* 한국 음력 계산 엔진 — 천문 계산(Meeus) 기반, 한국 표준시 기준. ES3 호환 (cscript 로 검증 가능) */
var LUNAR = (function () {
  var R = Math.PI / 180;
  function md(a, n) { return ((a % n) + n) % n; }
  function sunLon(jd) {
    var T = (jd - 2451545) / 36525;
    var L0 = 280.46646 + 36000.76983 * T + 0.0003032 * T * T;
    var M = (357.52911 + 35999.05029 * T - 0.0001537 * T * T) * R;
    var C = (1.914602 - 0.004817 * T - 0.000014 * T * T) * Math.sin(M) + (0.019993 - 0.000101 * T) * Math.sin(2 * M) + 0.000289 * Math.sin(3 * M);
    return md(L0 + C - 0.00569 - 0.00478 * Math.sin((125.04 - 1934.136 * T) * R), 360);
  }
  function deltaT(y) { // 초
    var t;
    if (y < 1920) { t = y - 1900; return -2.79 + 1.494119 * t - 0.0598939 * t * t + 0.0061966 * t * t * t - 0.000197 * t * t * t * t; }
    if (y < 1941) { t = y - 1920; return 21.20 + 0.84493 * t - 0.0761 * t * t + 0.0020936 * t * t * t; }
    if (y < 1961) { t = y - 1950; return 29.07 + 0.407 * t - t * t / 233 + t * t * t / 2547; }
    if (y < 1986) { t = y - 1975; return 45.45 + 1.067 * t - t * t / 260 - t * t * t / 718; }
    if (y < 2005) { t = y - 2000; return 63.86 + 0.3345 * t - 0.060374 * t * t + 0.0017275 * t * t * t + 0.000651814 * t * t * t * t + 0.00002373599 * t * t * t * t * t; }
    if (y < 2050) { t = y - 2000; return 62.92 + 0.32217 * t + 0.005589 * t * t; }
    return -20 + 32 * Math.pow((y - 1820) / 100, 2) - 0.5628 * (2150 - y);
  }
  function newMoon(k) { // 삭의 JD(UT)
    var T = k / 1236.85, T2 = T * T, T3 = T2 * T, T4 = T3 * T;
    var jde = 2451550.09766 + 29.530588861 * k + 0.00015437 * T2 - 0.00000015 * T3 + 0.00000000073 * T4;
    var E = 1 - 0.002516 * T - 0.0000074 * T2;
    var M = (2.5534 + 29.1053567 * k - 0.0000014 * T2 - 0.00000011 * T3) * R;
    var Mp = (201.5643 + 385.81693528 * k + 0.0107582 * T2 + 0.00001238 * T3 - 0.000000058 * T4) * R;
    var F = (160.7108 + 390.67050284 * k - 0.0016118 * T2 - 0.00000227 * T3 + 0.000000011 * T4) * R;
    var Om = (124.7746 - 1.56375588 * k + 0.0020672 * T2 + 0.00000215 * T3) * R;
    var s = Math.sin;
    var c = -0.4072 * s(Mp) + 0.17241 * E * s(M) + 0.01608 * s(2 * Mp) + 0.01039 * s(2 * F)
      + 0.00739 * E * s(Mp - M) - 0.00514 * E * s(Mp + M) + 0.00208 * E * E * s(2 * M)
      - 0.00111 * s(Mp - 2 * F) - 0.00057 * s(Mp + 2 * F) + 0.00056 * E * s(2 * Mp + M)
      - 0.00042 * s(3 * Mp) + 0.00042 * E * s(M + 2 * F) + 0.00038 * E * s(M - 2 * F)
      - 0.00024 * E * s(2 * Mp - M) - 0.00017 * s(Om) - 0.00007 * s(Mp + 2 * M)
      + 0.00004 * s(2 * Mp - 2 * F) + 0.00004 * s(3 * M) + 0.00003 * s(Mp + M - 2 * F)
      + 0.00003 * s(2 * Mp + 2 * F) - 0.00003 * s(Mp + M + 2 * F) + 0.00003 * s(Mp - M + 2 * F)
      - 0.00002 * s(Mp - M - 2 * F) - 0.00002 * s(3 * Mp + M) + 0.00002 * s(4 * Mp);
    var A = [[299.77, 0.107408, 0.000325], [251.88, 0.016321, 0.000165], [251.83, 26.651886, 0.000164], [349.42, 36.412478, 0.000126],
      [84.66, 18.206239, 0.00011], [141.74, 53.303771, 0.000062], [207.14, 2.453732, 0.00006], [154.84, 7.30686, 0.000056],
      [34.52, 27.261239, 0.000047], [207.19, 0.121824, 0.000042], [291.34, 1.844379, 0.00004], [161.72, 24.198154, 0.000037],
      [239.56, 25.513099, 0.000035], [331.55, 3.592518, 0.000023]];
    for (var i = 0; i < A.length; i++) {
      var arg = A[i][0] + A[i][1] * k - (i === 0 ? 0.009173 * T2 : 0);
      c += A[i][2] * s(arg * R);
    }
    var jd = jde + c;
    var yr = 2000 + (jd - 2451545) / 365.25;
    return jd - deltaT(yr) / 86400;
  }
  function tzOf(jd) { // 시간대(시간 단위): 1912 이전, 1954.3~1961.8 은 UTC+8:30
    var u = (jd - 2440587.5) * 864e5;
    if (u < Date.UTC(1912, 0, 1) || (u >= Date.UTC(1954, 2, 20, 15) && u < Date.UTC(1961, 7, 9, 15))) return 8.5;
    return 9;
  }
  function dayNo(jd) { return Math.floor(jd + 0.5 + tzOf(jd) / 24); } // 해당 시각의 한국 날짜(JDN)
  function dayStartJD(dn) { return dn - 0.5 - 9 / 24; }
  function solstice(y) { // 동지(황경 270°) JD
    var jd = (Date.UTC(y, 11, 21) / 864e5) + 2440587.5;
    for (var i = 0; i < 8; i++) jd += (md(270 - sunLon(jd) + 180, 360) - 180) * 365.2422 / 360;
    return jd;
  }
  function m11k(y) { // y년 동지를 품은 11월의 삭 번호
    var sd = dayNo(solstice(y));
    var k = Math.floor((solstice(y) - 2451550.09766) / 29.530588861);
    while (dayNo(newMoon(k)) > sd) k--;
    while (dayNo(newMoon(k + 1)) <= sd) k++;
    return k;
  }
  var cache = {};
  function sui(y) { // 동지(y-1)월 ~ 동지(y)월 직전까지의 달 목록
    if (cache[y]) return cache[y];
    var k0 = m11k(y - 1), k1 = m11k(y), n = k1 - k0, days = [], i;
    for (i = 0; i <= n; i++) days.push(dayNo(newMoon(k0 + i)));
    var leapIdx = -1;
    if (n === 13) {
      for (i = 0; i < n; i++) {
        var a = Math.floor(sunLon(dayStartJD(days[i])) / 30), b = Math.floor(sunLon(dayStartJD(days[i + 1])) / 30);
        if (a === b) { leapIdx = i; break; }
      }
    }
    var out = [], num = 10, seen1 = false;
    for (i = 0; i < n; i++) {
      var leap = false;
      if (i === leapIdx) leap = true; else num = num % 12 + 1;
      if (num === 1 && !leap) seen1 = true;
      out.push({ y: seen1 ? y : y - 1, m: num, leap: leap, start: days[i], len: days[i + 1] - days[i] });
    }
    cache[y] = out;
    return out;
  }
  function monthsOf(Y) {
    var all = sui(Y).concat(sui(Y + 1)), r = [];
    for (var i = 0; i < all.length; i++) if (all[i].y === Y) r.push(all[i]);
    return r;
  }
  function jdnToYMD(j) { var d = new Date((j - 2440588) * 864e5); return { y: d.getUTCFullYear(), m: d.getUTCMonth() + 1, d: d.getUTCDate() }; }
  function ymdToJdn(y, m, d) { return Date.UTC(y, m - 1, d) / 864e5 + 2440588; }
  function toSolar(Y, M, D, leap) {
    var ms = monthsOf(Y);
    for (var i = 0; i < ms.length; i++) {
      if (ms[i].m === M && ms[i].leap === !!leap) {
        if (D < 1 || D > ms[i].len) return { error: Y + '년 음력 ' + (leap ? '윤' : '') + M + '월은 ' + ms[i].len + '일까지 있어요' };
        return jdnToYMD(ms[i].start + D - 1);
      }
    }
    return { error: leap ? Y + '년에는 음력 윤' + M + '월이 없어요' : '날짜를 확인해 주세요' };
  }
  function toLunar(y, m, d) {
    var j = ymdToJdn(y, m, d);
    for (var Y = y; Y >= y - 1; Y--) {
      var ms = monthsOf(Y);
      for (var i = 0; i < ms.length; i++) if (j >= ms[i].start && j < ms[i].start + ms[i].len) return { y: Y, m: ms[i].m, d: j - ms[i].start + 1, leap: ms[i].leap };
    }
    return null;
  }
  function leapMonth(Y) { var ms = monthsOf(Y); for (var i = 0; i < ms.length; i++) if (ms[i].leap) return ms[i].m; return 0; }
  return { toSolar: toSolar, toLunar: toLunar, leapMonth: leapMonth, monthsOf: monthsOf, sunLon: sunLon };
})();

addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('#smapPanel').hidden)toggleMap(false);closeModal();}});

const latest=(arr)=>arr.length?arr[arr.length-1]:null;
function route(){
  flushSave(); clearTimeout(genTick);
  const h=location.hash||'#/'; let m;
  const V=$('#view');
  const need=()=>{if(!authed()){go('#/auth?next='+encodeURIComponent(h));return true;}return false;};
  try{
  if(h==='#/'||h==='')scrIntro();
  else if(h==='#/example')scrExample();
  else if(h.startsWith('#/auth'))scrAuth();
  else if(h.startsWith('#/setup/')){if(need())return;const s=h.slice(8);({mode:scrMode,context:scrContext,reflection:scrReflection,birth:scrBirth,review:scrReview}[s]||scrMode)();}
  else if((m=h.match(/^#\/generations\/([\w-]+)/))){if(need())return;const id=m[1]==='latest'?(latest(DB.gens)||{}).id:m[1];scrGen(id);}
  else if((m=h.match(/^#\/reports\/([\w-]+)\/feedback/))){if(need())return;const id=m[1]==='latest'?(latest(DB.reports)||{}).id:m[1];scrReport(id,true);}
  else if((m=h.match(/^#\/reports\/([\w-]+)/))){if(need())return;const id=m[1]==='latest'?(latest(DB.reports)||{}).id:m[1];scrReport(id);}
  else if((m=h.match(/^#\/plans\/([\w-]+)\/review/))){if(need())return;const id=m[1]==='latest'?(latest(DB.plans.filter(p=>p.status==='draft'))||latest(DB.plans)||{}).id:m[1];scrPlanReview(id);}
  else if(h==='#/app/action'){if(need())return;scrBoard();const p=activePlan();if(p&&p.actions.find(a=>!a.archived))openAction(p,p.actions.find(a=>!a.archived).id);}
  else if(h.startsWith('#/app/checkin')){if(need())return;const p=activePlan();scrCheckin(p,p?+(h.split('/')[3]||curWeek(p)):1);}
  else if(h.startsWith('#/app')){if(need())return;scrBoard();}
  else if(h==='#/history'){if(need())return;scrHistory();}
  else if(h==='#/settings/privacy'){if(need())return;scrPrivacy();}
  else if((m=h.match(/^#\/settings\/requests\/([\w-]+)/))){const id=m[1]==='latest'?(latest(DB.privacy)||{}).id:m[1];scrRequest(id);}
  else scrIntro();
  }catch(e){console.error(e);V.innerHTML=`<div class="narrow" style="padding-top:40px"><div class="banner err"><b>화면을 그리지 못했어요.</b><span class="grow">${esc(e.message)}</span><a class="btn sm" href="#/">처음으로</a></div></div>`;}
  setTop(); window.scrollTo(0,0); V.focus({preventScroll:true});
}

/* ════════ SCR-03 인증 ════════ */
function scrAuth(){
  const next=decodeURIComponent((location.hash.split('next=')[1]||'').trim());
  const safeNext=next.startsWith('#/')&&!next.startsWith('#//')?next:null;
  const P=DB.authPending;
  $('#view').innerHTML=`<div class="narrow stack" style="padding-top:28px;max-width:520px">
   <span class="label">SCR-03</span><h2>로그인 · 시작하기</h2>
   <div class="banner warn"><b>프로토타입</b><span class="grow">실제 이메일은 보내지 않아요. 코드를 요청하면 화면에 표시돼요.</span></div>
   <form class="sheet panel" id="af" novalidate>
    <div class="f"><label class="lb" for="em">이메일<em>*</em></label><input id="em" type="email" autocomplete="email" value="${esc(P?P.email:'')}" aria-describedby="emE"><span class="fe" id="emE"></span></div>
    <div class="row"><button class="btn" type="button" id="sendCode">인증 코드 받기</button><span class="note" id="codeNote">${P?`요청한 코드(시연용 표시): <b style="font-family:var(--f-mono)">${P.code}</b> · 10분 유효`:''}</span></div>
    <div class="f"><label class="lb" for="code">인증 코드 6자리<em>*</em></label><input id="code" inputmode="numeric" maxlength="6" autocomplete="one-time-code" aria-describedby="codeE"><span class="fe" id="codeE"></span></div>
    <label class="chk"><input type="checkbox" id="adult"><span><b>(필수) 대한민국 기준 성인입니다</b><small>자기확인이에요. 이메일 인증이 나이를 확인하지는 않아요.</small></span></label>
    <label class="chk"><input type="checkbox" id="terms"><span><b>(필수) 이용약관과 개인정보 처리 안내를 확인했습니다</b><small>홍보 수신 동의는 받지 않아요.</small></span></label>
    <p class="fe" id="afE" role="alert"></p>
    <button class="btn primary" type="submit">확인하고 시작</button></form>
   <a class="linkbtn" href="#/example">성인이 아니거나 아직 망설여진다면 공개 예시만 보기</a></div>`;
  $('#sendCode').onclick=()=>{const em=$('#em').value.trim();if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)){$('#emE').textContent='이메일 형식을 확인해 주세요.';$('#em').setAttribute('aria-invalid','true');return;}
    $('#emE').textContent='';$('#em').removeAttribute('aria-invalid');
    if(DB.authPending&&Date.now()-DB.authPending.sentAt<60000&&DB.authPending.email===em){$('#codeNote').innerHTML=`재발송은 60초 뒤에 할 수 있어요. 기존 코드: <b style="font-family:var(--f-mono)">${DB.authPending.code}</b>`;return;}
    DB.authPending={email:em,code:String(Math.floor(100000+Math.random()*900000)),sentAt:Date.now(),tries:0};persist();
    $('#codeNote').innerHTML=`입력한 주소로 코드를 보냈다고 가정해요(시연용 표시): <b style="font-family:var(--f-mono)">${DB.authPending.code}</b> · 10분 유효`;$('#code').focus();};
  $('#af').onsubmit=e=>{e.preventDefault();const P=DB.authPending,c=$('#code').value.trim(),E=$('#afE');E.textContent='';$('#codeE').textContent='';
    if(!P){E.textContent='먼저 인증 코드를 요청해 주세요.';return;}
    if(Date.now()-P.sentAt>600000){$('#codeE').textContent='코드가 만료됐어요. 새 코드를 요청해 주세요.';return;}
    if(P.tries>=5){$('#codeE').textContent='시도 횟수를 넘었어요. 새 코드를 요청해 주세요.';return;}
    if(c!==P.code){P.tries++;persist();$('#codeE').textContent=`코드가 맞지 않아요. (남은 시도 ${5-P.tries}회)`;$('#code').setAttribute('aria-invalid','true');$('#code').focus();return;}
    if(!$('#adult').checked){E.textContent='성인 확인이 필요해요. 성인이 아니라면 공개 예시만 이용할 수 있어요.';return;}
    if(!$('#terms').checked){E.textContent='필수 안내 확인에 체크해 주세요.';return;}
    DB.user={id:DB.user&&DB.user.email===P.email?DB.user.id:uid('usr'),email:P.email,status:'active',adultSelfConfirmedAt:nowISO(),termsAt:nowISO()};DB.authPending=null;
    if(!consentOn('core_service'))setConsent('core_service',true);persist();toast('로그인했어요');
    go(safeNext||(DB.draft&&DB.draft.desired_change?'#/setup/review':'#/setup/mode'));};
}

    <label class="chk"><input type="checkbox" id="cAi" ${ai?'checked':''}><span><b>(선택) AI 문장 작성 동의</b><small>${esc(CONSENT_TXT.ai_generation.t)}. 동의하지 않으면 규칙 기반으로 작성해요. (문구 ${CONSENT_TXT.ai_generation.v})</small></span></label>
    <p class="fe" id="mE" role="alert"></p>
   </div>
   <div class="navbtns"><a class="btn ghost" href="#/">취소</a><button class="btn primary" type="button" id="nx">현재 상황 입력 →</button></div></div>`;
  $$('input[name=dom]').forEach(r=>r.onchange=()=>patchDraft(x=>x.primary_domain=r.value));
  $$('input[name=mode]').forEach(r=>r.onchange=()=>{const want=r.value==='saju';
    if(!want&&d.saju_selected&&(DB.birth||consentOn('traditional_saju'))){r.checked=false;$('input[name=mode][value=saju]').checked=true;
      openModal(`<h3>전통 해석을 해제할까요?</h3><p>사주 선택을 해제하면 저장된 출생정보를 삭제하고 사주 분석 동의를 철회해요. 사주가 포함된 이전 지침서는 열람이 제한돼요.</p><div class="row" style="justify-content:flex-end"><button class="btn" data-x>취소</button><button class="btn danger" data-ok>해제하고 삭제</button></div>`,b=>{b.querySelector('[data-ok]').onclick=()=>{withdrawSaju('mode_off');patchDraft(x=>x.saju_selected=false);closeModal();scrMode();toast('사주 선택을 해제하고 관련 자료 삭제를 요청했어요');};});return;}
    patchDraft(x=>x.saju_selected=want);$('#sajuC').hidden=!want;});

  $('#cAi').onchange=e=>{setConsent('ai_generation',e.target.checked);persist();};
  $('#nx').onclick=()=>{const dd=ensureDraft();if(!dd.primary_domain){$('#mE').textContent='먼저 정리할 영역을 하나 골라 주세요.';$('input[name=dom]').focus();return;}
    if(dd.saju_selected&&!consentOn('traditional_saju')){$('#mE').textContent='사주를 추가하려면 사주 분석 동의가 필요해요. 원하지 않으면 현실 중심을 골라 주세요.';$('#cSaju').focus();return;}
    nextAfterSave('#/setup/context');};
  updSave();
}
/* SCR-05 */
function scrContext(){
  const d=ensureDraft();
  $('#view').innerHTML=`<div class="narrow stack" style="padding-top:24px">${stepsHtml('context')}
   <h2>현재 상황</h2>
   <div class="errsum" id="es" hidden tabindex="-1"></div>
   <div class="sheet panel">
    <div class="f"><label class="lb" for="dc">90일 뒤 무엇이 달라지면 좋을까요?<em>*</em></label><textarea id="dc" aria-describedby="dcE">${esc(d.desired_change)}</textarea><span class="cnt"></span><span class="fe" id="dcE"></span></div>
    <div class="f"><label class="lb" for="cs">현재 상황<small>선택</small></label><textarea id="cs">${esc(d.current_situation)}</textarea><span class="cnt"></span></div>
    <div class="f"><span class="lb" id="wmL">일주일에 쓸 수 있는 시간</span><div class="row"><input id="wm" type="number" min="0" max="2400" step="5" inputmode="numeric" style="max-width:160px" aria-labelledby="wmL" value="${d.weekly_available_minutes??''}" ${d.minutes_unknown?'disabled':''}><span>분</span><label class="chk"><input type="checkbox" id="wmU" ${d.minutes_unknown?'checked':''}>아직 모르겠어요</label></div>
     <span class="help">5분 단위, 0~2,400분. 미정이어도 지침서는 만들 수 있지만 계획을 시작하기 전에 확정해야 해요. 0분이면 휴식·정리 중심으로 안내해요.</span><span class="fe" id="wmE"></span></div>
    <fieldset class="f" style="border:0;padding:0;margin:0"><legend class="lb">이번 달 쓸 수 있는 예산<em>*</em></legend><div class="chips">${Object.entries(BUDGET).map(([k,n])=>`<label class="chip"><input type="radio" name="bud" value="${k}" ${d.budget_band===k?'checked':''}>${n}</label>`).join('')}</div><span class="fe" id="budE"></span></fieldset>
    <div class="f"><span class="lb">꼭 지켜야 할 생활 조건<small>최대 5개 · 각 100자</small></span><div class="stack" id="cons" style="gap:8px"></div><button class="btn sm" type="button" id="addC" style="align-self:flex-start">+ 조건 추가</button></div>
    <fieldset class="f" style="border:0;padding:0;margin:0"><legend class="lb">중요한 가치<small>최대 3개</small></legend><div class="chips">${PRIORITIES.map(p=>`<label class="chip"><input type="checkbox" name="pri" value="${p}" ${d.priorities.includes(p)?'checked':''}>${p}</label>`).join('')}</div></fieldset>
    <p class="note">※ 계좌번호·주민등록번호·진단명·다른 사람의 개인정보는 적지 마세요.</p>
   </div>
   <div class="navbtns"><a class="btn ghost" href="#/setup/mode">← 이전</a><button class="btn primary" type="button" id="nx">다음 →</button></div></div>`;
  const dc=$('#dc'),cs=$('#cs');
  [[dc,500,10,'desired_change'],[cs,1000,0,'current_situation']].forEach(([el,max,min,k])=>{fieldCount(el,max,min);el.oninput=()=>{fieldCount(el,max,min);patchDraft(x=>x[k]=el.value);};});
  const wm=$('#wm'),wmU=$('#wmU');
  wm.oninput=()=>patchDraft(x=>{x.weekly_available_minutes=wm.value===''?null:+wm.value;x.capacity_zero=wm.value==='0';});
  wmU.onchange=()=>{wm.disabled=wmU.checked;patchDraft(x=>{x.minutes_unknown=wmU.checked;if(wmU.checked)x.weekly_available_minutes=null;});if(!wmU.checked)wm.focus();};
  $$('input[name=bud]').forEach(r=>r.onchange=()=>patchDraft(x=>x.budget_band=r.value));
  $$('input[name=pri]').forEach(c=>c.onchange=()=>{const sel=$$('input[name=pri]:checked').map(x=>x.value);if(sel.length>3){c.checked=false;toast('중요한 가치는 최대 3개까지 고를 수 있어요');return;}patchDraft(x=>x.priorities=sel);});
  const renderCons=()=>{$('#cons').innerHTML=ensureDraft().constraints.map((c,i)=>`<div class="row"><input data-ci="${i}" value="${esc(c)}" aria-label="생활 조건 ${i+1}" style="flex:1"><button class="btn sm ghost" type="button" data-cd="${i}" aria-label="조건 ${i+1} 삭제">삭제</button></div>`).join('');
    $$('[data-ci]').forEach(el=>el.oninput=()=>patchDraft(x=>x.constraints[+el.dataset.ci]=el.value));
    $$('[data-cd]').forEach(b=>b.onclick=()=>{patchDraft(x=>x.constraints.splice(+b.dataset.cd,1));renderCons();});
    $('#addC').disabled=ensureDraft().constraints.length>=5;};
  renderCons();$('#addC').onclick=()=>{patchDraft(x=>x.constraints.push(''));renderCons();$$('[data-ci]').pop().focus();};
  $('#nx').onclick=()=>{const x=ensureDraft(),errs=[];['dcE','wmE','budE'].forEach(i=>$('#'+i).textContent='');dc.removeAttribute('aria-invalid');
    const n=ulen(x.desired_change.trim());if(n<10||n>500){errs.push(['dc','바라는 변화는 10~500자로 적어 주세요.','dcE']);}
    if(!x.minutes_unknown&&(x.weekly_available_minutes===null||x.weekly_available_minutes<0||x.weekly_available_minutes>2400||x.weekly_available_minutes%5)){errs.push(['wm','주당 시간은 0~2,400분, 5분 단위로 적거나 "아직 모르겠어요"를 골라 주세요.','wmE']);}
    if(!x.budget_band)errs.push(['bud','예산 범위를 골라 주세요. "미정"도 괜찮아요.','budE']);
    if(x.constraints.some(c=>ulen(c)>100))errs.push(['cons','생활 조건은 각각 100자 이하로 적어 주세요.',null]);
    const secret=/(\d{6}-?[1-4]\d{6})|(\d{2,6}-\d{2,6}-\d{2,8})/;
    if(secret.test(x.desired_change+x.current_situation+x.constraints.join(' ')))errs.push(['dc','주민등록번호나 계좌번호로 보이는 숫자가 있어요. 지우고 다시 저장해 주세요.','dcE']);
    if(errs.length){const es=$('#es');es.hidden=false;es.innerHTML=`<b>${errs.length}개 항목을 확인해 주세요.</b><ul>${errs.map(e=>`<li><a href="#" data-f="${e[0]}">${e[1]}</a></li>`).join('')}</ul>`;
      errs.forEach(e=>{if(e[2])$('#'+e[2]).textContent=e[1];const el=$('#'+e[0])||$(`input[name=${e[0]}]`);if(el&&el.setAttribute)el.setAttribute('aria-invalid','true');});
      es.querySelectorAll('[data-f]').forEach(a=>a.onclick=ev=>{ev.preventDefault();const el=$('#'+a.dataset.f)||$(`input[name=${a.dataset.f}]`);el&&el.focus();});
      const first=$('#'+errs[0][0])||$(`input[name=${errs[0][0]}]`);first&&first.focus();return;}
    nextAfterSave('#/setup/reflection');};
  updSave();
}

function scrReflection(){
  const d=ensureDraft();
  $('#view').innerHTML=`<div class="narrow stack" style="padding-top:24px">${stepsHtml('reflection')}
   <h2>자기이해 질문</h2><p class="lead">정답은 없어요. 떠오르는 만큼만 적고, 전부 건너뛰어도 지침서는 만들 수 있어요. 이 응답에는 성격 점수나 유형을 붙이지 않아요.</p>
   <div class="sheet panel">${REFLECT.map(([k,q],i)=>`<div class="f"><label class="lb" for="${k}">${i+1}. ${q}<small>선택 · 500자</small></label><textarea id="${k}">${esc(d.reflection[k]||'')}</textarea><span class="cnt"></span></div>`).join('')}

  REFLECT.forEach(([k])=>{const el=$('#'+k);fieldCount(el,500);el.oninput=()=>{fieldCount(el,500);patchDraft(x=>x.reflection[k]=el.value);};});
  $('#mb').onchange=e=>patchDraft(x=>x.mbti=e.target.value);
  const nx=()=>{if(REFLECT.some(([k])=>ulen(ensureDraft().reflection[k])>500)){toast('500자를 넘은 답변이 있어요');return;}nextAfterSave(ensureDraft().saju_selected?'#/setup/birth':'#/setup/review');};

function scrBirth(){

     :v==='range'?`<div class="row" style="margin-top:8px"><label>시작 <input id="ts" type="time" value="${esc(B.time_start)}" style="max-width:150px"></label><label>끝 <input id="te" type="time" value="${esc(B.time_end)}" style="max-width:150px"></label></div><p class="help">끝이 시작보다 이르면 다음 날로 넘어간 것으로 봐요. 범위 안의 시주가 다르면 대안을 함께 보여 드려요(최대 8개).</p>`

  $('#nx').onclick=()=>{save();const v=validateBirth(DB.birth);const es=$('#es');

    nextAfterSave('#/setup/review');};

function birthToSolar(B){const y=+B.y,m=+B.m,d=+B.d;
  if(!(y>=1900&&y<=2100))return {error:'지원 범위(1900–2100년) 밖이에요.',code:'UNSUPPORTED_BIRTH_INPUT'};
  if(!(m>=1&&m<=12)||!(d>=1&&d<=31))return {error:'날짜를 확인해 주세요.',code:'VALIDATION_ERROR'};
  if(B.calendar_type==='lunar'){if(B.is_leap_month===null)return {error:'윤달 여부를 몰라 양력으로 변환하지 않았어요.',code:'LUNAR_LEAP_UNKNOWN'};const r=LUNAR.toSolar(y,m,d,B.is_leap_month);return r.error?{error:r.error,code:'VALIDATION_ERROR'}:r;}
  const dt=new Date(Date.UTC(y,m-1,d));if(dt.getUTCMonth()!==m-1)return {error:'존재하지 않는 날짜예요.',code:'VALIDATION_ERROR'};return {y,m,d};}
function validateBirth(B){const e=[];if(!B)return [{m:'출생정보를 입력해 주세요.'}];
  const r=birthToSolar(B);if(r.error)e.push({m:r.error,code:r.code});
  if(!B.time_precision)e.push({m:'출생 시각을 정확히 앎·대략 범위·모름 중에서 골라 주세요.'});
  if(B.time_precision==='exact'&&!B.birth_time)e.push({m:'출생 시·분을 입력해 주세요.'});
  if(B.time_precision==='range'&&(!B.time_start||!B.time_end))e.push({m:'시간 범위의 시작과 끝을 입력해 주세요.'});
  if(!B.city_id)e.push({m:'출생 도시를 골라 주세요.'});return e;}

const STAGES=[['queued','대기','요청을 받았어요'],['normalizing','입력 확인','입력과 동의를 확인하고 있어요'],['calculating','계산','선택한 분석을 계산하고 있어요'],['retrieving','자료 찾기','필요한 승인 자료를 확인하고 있어요'],['generating','작성','지침서를 작성하고 있어요'],['validating','검수','근거와 안전성을 확인하고 있어요']];
let genTick=null, sampleFn=null;
(async()=>{try{if(window.claude&&window.claude.use)sampleFn=await window.claude.use('sample');}catch(e){sampleFn=null;}})();
function snapshot(){const d=JSON.parse(JSON.stringify(ensureDraft())),saju=d.saju_selected&&consentOn('traditional_saju');
  return {id:uid('snap'),draft_revision:d.revision,draft:d,birth:saju?JSON.parse(JSON.stringify(DB.birth)):null,consents:{core:consentOn('core_service'),saju,ai:consentOn('ai_generation')},ruleset:saju?RULESET.id:null,at:nowISO()};}
function startGeneration(purpose,extra){
  const running=DB.gens.find(g=>!['completed','limited','failed','cancelled'].includes(g.status));if(running)return running;
  const g={id:uid('gen'),status:'queued',purpose,snapshot:snapshot(),extra:extra||null,created:nowISO(),stageAt:Date.now(),stageIdx:0,report_id:null,error:null};
  DB.gens.push(g);persist();return g;}
function scrGen(id){
  const g=DB.gens.find(x=>x.id===id);
  if(!g){$('#view').innerHTML=`<div class="narrow" style="padding-top:28px"><div class="banner"><b>생성 작업이 없어요.</b><span class="grow">아직 지침서를 만들지 않았어요.</span><a class="btn sm primary" href="#/setup/review">생성 전 확인으로</a></div></div>`;return;}
  const draw=()=>{const done=['completed','limited'].includes(g.status),fail=g.status==='failed',canc=g.status==='cancelled',slow=Date.now()-new Date(g.created).getTime()>120000;
    const si=STAGES.findIndex(s=>s[0]===g.status);
    $('#view').innerHTML=`<div class="narrow stack" style="padding-top:24px"><span class="label">SCR-09 · ${esc(g.id)}</span><h2>${done?'지침서가 준비되었어요':fail?'지침서를 만들지 못했어요':canc?'생성을 취소했어요':'지침서를 만들고 있어요'}</h2>
     <ul class="tl" aria-label="생성 단계">${STAGES.map((s,i)=>{const sub=s[0]==='calculating'&&!g.snapshot.birth;const cls=sub?'na':done||(si>i&&si>=0)?'done':i===si&&!fail&&!canc?'cur':fail&&i===g.failedAt?'fail':'';return `<li class="${cls}"><i></i><span><b>${s[1]}</b> <span class="note">${sub?'선택한 전통 분석이 없어 건너뛰었어요':s[2]}</span></span><span class="st ${cls==='done'?'ok':cls==='cur'?'':cls==='fail'?'err':'mute'}">${cls==='done'?'완료':cls==='cur'?'진행 중':cls==='fail'?'실패':cls==='na'?'해당 없음':'대기'}</span></li>`;}).join('')}</ul>
     ${slow&&!done&&!fail&&!canc?'<div class="banner warn"><b>지연</b><span class="grow">평소보다 오래 걸리고 있어요. 결과가 준비되면 이 화면에서 확인할 수 있어요.</span></div>':''}
     ${done?`<div class="banner info"><b>${g.status==='limited'?'제한 결과':'완료'}</b><span class="grow">${g.status==='limited'?esc(g.limitNote||'일부 자료를 제외한 결과가 준비되었어요.'):'근거와 안전성 검수를 통과했어요.'}</span><a class="btn primary sm" href="#/reports/${g.report_id}">지침서 보기</a></div>`:''}
     ${fail?`<div class="banner err"><b>${esc(g.error.code)}</b><span class="grow">${esc(g.error.message)}</span>${g.error.retry?'<button class="btn sm" type="button" id="retry">다시 시도</button>':''}<a class="btn sm" href="#/setup/review">입력 확인으로</a></div>`:''}
     ${canc?`<div class="banner"><b>취소됨</b><span class="grow">${esc(g.cancelReason||'현재 작업 결과는 게시되지 않았어요.')}</span><a class="btn sm" href="#/setup/review">새로 만들기</a></div>`:''}
     <div class="row">${!done&&!fail&&!canc?'<button class="btn" type="button" id="cancel">취소</button><a class="btn ghost" href="#/app">실행판으로 이동</a>':''}</div>
     <p class="note">작성 중인 원문은 보여 드리지 않아요. 검수를 통과한 결과만 게시해요. 새로고침해도 이 작업을 이어서 보여 드려요.</p></div>`;
    const c=$('#cancel');if(c)c.onclick=()=>openModal(`<h3>생성을 취소할까요?</h3><p>현재 작업 결과는 게시되지 않아요.</p><div class="row" style="justify-content:flex-end"><button class="btn" data-x>계속 만들기</button><button class="btn danger" data-ok>취소</button></div>`,b=>{b.querySelector('[data-ok]').onclick=()=>{g.status='cancelled';g.cancelReason='사용자가 취소했어요. 결과는 게시되지 않았어요.';if(g.ctl)g.ctl.abort();persist();closeModal();draw();};});
    const r=$('#retry');if(r)r.onclick=()=>{const n=startGeneration(g.purpose,g.extra);go('#/generations/'+n.id);};};
  const step=async()=>{if(location.hash.indexOf(g.id)<0)return;
    if(['completed','limited','failed','cancelled'].includes(g.status)){draw();return;}
    const elapsed=Date.now()-g.stageAt, idx=STAGES.findIndex(s=>s[0]===g.status);
    if(elapsed<650){genTick=setTimeout(step,200);return;}
    if(g.status==='normalizing'){const cur=ensureDraft();
      if(cur.revision!==g.snapshot.draft_revision){g.status='cancelled';g.cancelReason='생성 중에 입력이 바뀌어 이전 입력의 결과를 게시하지 않았어요. 최신 입력으로 다시 만들어 주세요.';persist();draw();return;}
      if(g.snapshot.consents.saju&&!consentOn('traditional_saju')){g.status='cancelled';g.cancelReason='사주 동의가 철회되어 작업을 중단했어요.';persist();draw();return;}}
    if(g.status==='calculating'&&g.snapshot.birth){const r=sajuCalc(g.snapshot.birth);g.calc=r;if(r.error){g.limitNote=`사주 계산을 할 수 없어 전통 부록을 제외했어요: ${r.error}`;}}
    if(g.status==='generating'){g.stageAt=Date.now()+1e9;persist();draw();
      let content=null,used='rule';
      if(g.snapshot.consents.ai&&sampleFn){try{g.ctl=new AbortController();content=await aiGenerate(g);used='ai';}catch(e){content=null;g.aiNote=e&&e.code==='cancelled'?null:'AI 작성에 실패해 규칙 기반으로 작성했어요.';}}
      if(g.status==='cancelled')return;
      if(!content)content=ruleGenerate(g);
      g.content=content;g.used=used;g.status='validating';g.stageAt=Date.now();persist();draw();genTick=setTimeout(step,300);return;}
    if(g.status==='validating'){
      // 게시 직전 재확인
      if(ensureDraft().revision!==g.snapshot.draft_revision){g.status='cancelled';g.cancelReason='검수 중에 입력이 바뀌어 결과를 게시하지 않았어요.';persist();draw();return;}
      if(g.snapshot.consents.saju&&!consentOn('traditional_saju')){g.status='cancelled';g.cancelReason='사주 동의가 철회되어 결과를 게시하지 않았어요.';persist();draw();return;}
      if(!authed()){g.status='cancelled';persist();draw();return;}

      if(!v.ok){g.status='failed';g.failedAt=5;g.error={code:'SAFETY_REVIEW_FAILED',message:'검수를 통과하지 못해 결과를 게시하지 않았어요. 입력을 조정하거나 다시 시도해 주세요.',retry:true};persist();draw();return;}
      publish(g);draw();return;}
    g.status=STAGES[idx+1][0];g.stageAt=Date.now();persist();draw();genTick=setTimeout(step,200);};
  draw();if(!['completed','limited','failed','cancelled'].includes(g.status)){if(g.status==='generating')g.status='retrieving';g.stageAt=Date.now();genTick=setTimeout(step,200);}
}

   <section class="sheet panel"><h3>처리 요청</h3>${DB.privacy.length?`<div class="list">${DB.privacy.slice().reverse().map(j=>`<div class="item" style="padding:0"><div><b>${esc(j.label)}</b><div class="meta">${new Date(j.created).toLocaleString('ko-KR')} · ${({requested:'접수',access_blocked:'접근 차단',purging:'처리 중',awaiting_external:'외부 처리 대기',awaiting_backup:'백업 만료 대기',completed:'완료'})[j.status]}</div></div><a class="btn sm" href="#/settings/requests/${j.id}">상태 보기</a></div>`).join('')}</div>`:'<p class="note">처리 요청이 없어요.</p>'}</section>
   <section class="sheet panel"><h3>계정 삭제</h3><p class="note">진행 중인 생성은 취소되고, 지침서·계획·기록·세션이 모두 삭제돼요. 최근 인증이 필요해요.</p><button class="btn danger" type="button" id="delAcc" style="align-self:flex-start">계정 삭제</button></section>
   <p class="note">내보내기(P1)는 아직 준비 중이라 제공하지 않아요.</p></div>`;
  $$('[data-g]').forEach(b=>b.onclick=()=>{setConsent(b.dataset.g,true);persist();scrPrivacy();toast('동의했어요');});
  $$('[data-w]').forEach(b=>b.onclick=()=>{const p=b.dataset.w;
    if(p==='traditional_saju')openModal(`<h3>사주 분석 동의를 철회할까요?</h3><p>사주 분석에 대한 동의를 철회하면 관련 자료의 사용을 즉시 중단해요. 사주 정보가 포함된 이전 지침서는 열람이 제한되고, 연관 자료 삭제가 진행돼요. 현실 중심의 새 지침서는 다시 만들 수 있어요.</p><p class="note">계획의 행동은 사주를 근거로 만들지 않았으므로 그대로 유지돼요.</p><div class="row" style="justify-content:flex-end"><button class="btn" data-x>취소</button><button class="btn danger" data-ok>철회</button></div>`,bx=>{bx.querySelector('[data-ok]').onclick=()=>{withdrawSaju('privacy');if(DB.draft)DB.draft.saju_selected=false;persist();closeModal();go('#/settings/requests/latest');};});
    else{setConsent(p,false);persist();scrPrivacy();toast('철회했어요. 다음 지침서부터 규칙 기반으로 작성해요');}});
  $$('[data-del]').forEach(b=>b.onclick=()=>{const k=b.dataset.del,N={draft:'목표·현실 조건',reflection:'자기이해 응답',birth:'출생정보',logs:'실행 기록'}[k];
    openModal(`<h3>${N}을(를) 삭제할까요?</h3><p>${k==='birth'?'사주 동의도 함께 철회되고 사주가 포함된 지침서는 열람이 제한돼요.':k==='draft'?'현재 입력이 지워져요. 이미 만든 지침서의 입력 사본에는 영향을 주지 않지만, 새 지침서를 만들려면 다시 입력해야 해요.':k==='logs'?'모든 계획의 완료·건너뜀 기록이 지워져요.':'자기이해 응답이 지워져요.'}</p><div class="row" style="justify-content:flex-end"><button class="btn" data-x>취소</button><button class="btn danger" data-ok>삭제 요청</button></div>`,bx=>{bx.querySelector('[data-ok]').onclick=()=>{
      if(k==='birth'){withdrawSaju('delete_birth');}else{if(k==='draft'){DB.draft=null;}if(k==='reflection'&&DB.draft){DB.draft.reflection={};DB.draft.mbti='';DB.draft.revision++;}if(k==='logs')DB.plans.forEach(p=>p.occ={});privacyJob('delete_'+k,N+' 삭제');}
      persist();closeModal();go('#/settings/requests/latest');};});});
  $('#delAcc').onclick=()=>openModal(`<h3>계정을 삭제할까요?</h3><p>최근 인증을 위해 이메일을 다시 입력해 주세요.</p><div class="f"><label class="lb" for="re">이메일</label><input id="re" type="email"></div><p class="fe" id="reE"></p><div class="row" style="justify-content:flex-end"><button class="btn" data-x>취소</button><button class="btn danger" data-ok>계정 삭제</button></div>`,bx=>{bx.querySelector('[data-ok]').onclick=()=>{if(bx.querySelector('#re').value.trim()!==DB.user.email){bx.querySelector('#reE').textContent='RECENT_AUTH_REQUIRED · 로그인한 이메일과 같아야 해요.';return;}
    const token=Array.from(crypto.getRandomValues(new Uint8Array(16)),b=>b.toString(16).padStart(2,'0')).join('');DB.gens.forEach(g=>{if(g.ctl)g.ctl.abort();});const keep={privacy:DB.privacy};

    openModal(`<h3>계정 삭제를 접수했어요</h3><p>세션을 종료했어요. 처리 상태를 확인할 수 있는 코드예요. 이 코드로는 상태만 볼 수 있고 내용은 볼 수 없어요.</p><p style="font-family:var(--f-mono);word-break:break-all;padding:10px;border:1px solid var(--line);border-radius:8px">${token}</p><div class="row" style="justify-content:flex-end"><button class="btn primary" data-ok>확인</button></div>`,b2=>{b2.querySelector('[data-ok]').onclick=()=>{closeModal();go('#/settings/requests/'+j.id);};});};});
}
function scrRequest(id){
  advanceJobs();persist();const j=DB.privacy.find(x=>x.id===id);
  if(!j){$('#view').innerHTML=`<div class="narrow" style="padding-top:28px"><div class="banner"><b>처리 요청이 없어요.</b><a class="btn sm" href="#/settings/privacy">개인정보 관리</a></div></div>`;return;}
  const idx=j.stages.findIndex(s=>s[0]===j.status);
  $('#view').innerHTML=`<div class="narrow stack" style="padding-top:20px"><span class="label">SCR-18 · ${esc(j.id)}</span><h2>처리 요청 상태</h2><p><b>${esc(j.label)}</b></p><p class="note">요청 ${new Date(j.created).toLocaleString('ko-KR')} · 목표 처리일 ${j.target}${j.tokenHash?` · 상태 확인 코드 ${j.tokenHash}`:''}</p>
   <ul class="tl">${j.stages.map((s,i)=>`<li class="${s[2]?'done':i===idx+1?'cur':''}"><i></i><span><b>${s[1]}</b> <span class="note">${({requested:'요청을 받았어요',access_blocked:'관련 자료의 조회·전송·게시를 막았어요',purging:'이 브라우저 저장소에서 지웠어요',awaiting_external:'외부 공급자에 보낸 자료 확인(프로토타입: AI에 보낸 요청은 Claude 정책을 따름)',awaiting_backup:'백업 만료 대기(프로토타입: 백업 없음)',completed:'모든 저장소 처리 완료'})[s[0]]}</span></span><span class="st ${s[2]?'ok':'mute'}">${s[2]?hhmm(s[2]):'대기'}</span></li>`).join('')}</ul>
   <div class="banner warn"><b>전체 완료 아님</b><span class="grow">활성 저장소 삭제가 끝나도 외부 공급자 확인과 백업 만료가 남아 있으면 "완료"로 표시하지 않아요. 프로토타입에는 서버·백업이 없어 마지막 단계가 대기 상태로 남아요.</span></div>
   <div class="row"><button class="btn" type="button" id="rf">상태 새로고침</button>${authed()?`<a class="btn ghost" href="#/settings/privacy">개인정보 관리</a><a class="btn ghost" href="#/setup/review">현재 동의로 새로 만들기</a>`:'<a class="btn ghost" href="#/">처음으로</a>'}</div></div>`;
  $('#rf').onclick=()=>scrRequest(id);
}

let lastFocus=null;
function openModal(html,bind){lastFocus=document.activeElement;$('#modalRoot').innerHTML=`<div class="modal" role="dialog" aria-modal="true"><div class="sheet box">${html}</div></div>`;const m=$('#modalRoot .modal');
  m.addEventListener('click',e=>{if(e.target===m)closeModal();});m.querySelectorAll('[data-x]').forEach(b=>b.addEventListener('click',()=>closeModal()));bind&&bind(m);
  const f=m.querySelector('input,textarea,select,button');f&&f.focus();
  m.addEventListener('keydown',e=>{if(e.key!=='Tab')return;const fs=[...m.querySelectorAll('a,button,input,select,textarea')].filter(x=>!x.disabled);if(!fs.length)return;if(e.shiftKey&&document.activeElement===fs[0]){e.preventDefault();fs[fs.length-1].focus();}else if(!e.shiftKey&&document.activeElement===fs[fs.length-1]){e.preventDefault();fs[0].focus();}});}
function closeModal(){if(!$('#modalRoot').innerHTML)return;$('#modalRoot').innerHTML='';lastFocus&&lastFocus.focus&&lastFocus.focus({preventScroll:true});}
